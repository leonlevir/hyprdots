general {
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 7
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    outer_color = rgba(17, 17, 17, 1.0)
    inner_color = rgba(200, 200, 200, 1.0)
    font_color = rgba(10, 10, 10, 1.0)
    fade_on_empty = true
}

label {
    monitor =
    text = Olá, $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    position = 0, 80
    halign = center
    valign = center
}

